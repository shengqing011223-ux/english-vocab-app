<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小升初英语单词讲义</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { font-size:16px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
    background: linear-gradient(180deg,#f3f6ff 0%, #eef1fb 100%);
    color:#2d3350;
    min-height:100vh;
    padding-bottom: 40px;
  }
  .header {
    background: linear-gradient(135deg,#6a5cff 0%, #8a7bff 100%);
    color:#fff;
    padding: 28px 20px 22px;
    border-radius: 0 0 28px 28px;
    box-shadow: 0 8px 24px rgba(106,92,255,.28);
  }
  .header h1 { font-size: 22px; font-weight:700; letter-spacing:.5px; }
  .header p { margin-top:6px; font-size:13px; opacity:.92; line-height:1.5; }
  .header .actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .btn {
    border:none; border-radius:12px; padding:11px 16px; font-size:14px; font-weight:600;
    cursor:pointer; transition: transform .08s ease, box-shadow .08s ease;
    -webkit-user-select:none; user-select:none;
  }
  .btn:active { transform: scale(.96); }
  .btn.primary { background:#fff; color:#5a4cff; box-shadow:0 3px 10px rgba(0,0,0,.15); }
  .btn.ghost { background:rgba(255,255,255,.16); color:#fff; }

  .wrap { padding:18px 16px; }
  .section-title {
    display:flex; align-items:center; justify-content:space-between;
    margin: 6px 0 12px;
  }
  .section-title h2 { font-size:17px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .badge { font-size:12px; font-weight:600; color:#5a4cff; background:#e6e2ff; border-radius:20px; padding:3px 10px; }
  .section + .section { margin-top: 26px; }

  .word-card {
    background:#fff; border-radius:18px; padding:14px 16px; margin-bottom:12px;
    box-shadow: 0 4px 14px rgba(80,70,180,.08);
  }
  .word-top { display:flex; align-items:center; gap:10px; }
  .word-main { flex:1; min-width:0; }
  .word { font-size:22px; font-weight:700; color:#23294a; letter-spacing:.3px; }
  .phonetic { font-size:13px; color:#8a8fa8; margin-top:2px; }
  .meaning { font-size:14px; color:#5a5f7a; margin-top:4px; }
  .icon-btn {
    width:44px; height:44px; border-radius:14px; border:none; cursor:pointer;
    font-size:19px; display:flex; align-items:center; justify-content:center;
    background:#eef0ff; color:#5a4cff; flex-shrink:0; transition: transform .08s;
  }
  .icon-btn:active { transform: scale(.92); }

  .expand-area { margin-top:14px; border-top:1px solid #f0f1f8; padding-top:12px; display:none; }
  .word-card.open .expand-area { display:block; }
  .toggle-row { margin-top:12px; display:flex; gap:10px; align-items:center; }
  .toggle {
    font-size:13px; font-weight:600; color:#5a4cff; background:#f0eeff; border:none;
    padding:8px 14px; border-radius:10px; cursor:pointer;
  }

  /* 记忆讲解 */
  .block { margin-top:12px; border-radius:14px; padding:12px 14px; }
  .block-label { font-size:12px; font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .block-tips { background:#eef4ff; }
  .block-tips .block-label { color:#2f6bff; }
  .block-tips p { font-size:14px; line-height:1.7; color:#3a4466; }
  .block-tips .listen { margin-top:8px; display:inline-flex; align-items:center; gap:6px; font-size:12.5px;
    color:#2f6bff; background:#fff; border:1px solid #d4e0ff; border-radius:9px; padding:6px 12px; cursor:pointer; font-weight:600; }
  .block-deriv { background:#f4f6fa; }
  .block-deriv .block-label { color:#5a5f7a; }
  .tag-row { display:flex; flex-wrap:wrap; gap:8px; }
  .tag {
    background:#fff; border:1px solid #e0e4ef; border-radius:9px; padding:6px 11px;
    font-size:13px; color:#454a66; display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  }
  .tag .vol { color:#8a8fa8; font-size:12px; }

  /* 自然拼读 */
  .block-phonics { background:#f6f0ff; }
  .block-phonics .block-label { color:#8a2bff; }
  .chunk-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .chunk {
    background:#fff; border:2px solid #e3d5ff; border-radius:11px; padding:7px 10px; min-width:56px;
    text-align:center; transition: transform .15s, border-color .15s, background .15s, box-shadow .15s;
  }
  .chunk.active { border-color:#8a2bff; background:#fff; transform: scale(1.1); box-shadow:0 0 0 4px rgba(138,43,255,.15); }
  .chunk.letter-active { border-color:#ff6bcb; background:#fff0fb; transform: scale(1.18); box-shadow:0 0 0 4px rgba(255,107,203,.18); }
  .chunk .ch-letters { font-size:17px; font-weight:700; color:#3a2b5e; }
  .chunk .ch-letters .lit { color:#ff2fae; font-size:1.15em; }
  .chunk .ch-ipa { font-size:11px; color:#9a8fc0; margin-top:2px; }
  .chunk .ch-rule { font-size:10px; color:#b0a6d0; margin-top:1px; }
  .phonics-btns { display:flex; gap:8px; flex-wrap:wrap; }
  .phonics-btn {
    border:none; border-radius:11px; padding:10px 14px; font-size:13.5px; font-weight:700; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; transition: transform .08s, box-shadow .2s;
  }
  .phonics-btn:active { transform: scale(.95); }
  .phonics-btn.spell { background:#8a2bff; color:#fff; }
  .phonics-btn.full { background:#fff; color:#8a2bff; border:2px solid #d9c4ff; }
  .phonics-btn.glowing { animation: glowPulse 1.1s ease-in-out infinite; }
  @keyframes glowPulse { 0%,100%{ box-shadow:0 0 0 0 rgba(138,43,255,.5);} 50%{ box-shadow:0 0 0 10px rgba(138,43,255,0);} }

  /* 实时面板 */
  .live-panel {
    margin-top:10px; background:#2a2140; color:#efe9ff; border-radius:11px; padding:10px 12px;
    font-size:13px; min-height:42px; display:flex; align-items:center; gap:8px; line-height:1.6;
  }
  .live-panel .label { color:#8f84b8; font-size:12px; flex-shrink:0; }
  .live-panel .cur { color:#ffd75e; font-weight:700; }

  /* 发音检测 */
  .block-speak { background:#fff4f6; }
  .block-speak .block-label { color:#ff3d6e; }
  .speak-btn { border:none; border-radius:11px; padding:10px 15px; font-size:13.5px; font-weight:700; color:#fff;
    background:linear-gradient(135deg,#ff5c8a,#ff3d6e); cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .speak-btn:active { transform: scale(.95); }
  .speak-result { margin-top:10px; display:none; }
  .speak-result.show { display:block; }
  .ring-wrap { display:flex; align-items:center; gap:14px; }
  .ring { position:relative; width:72px; height:72px; flex-shrink:0; }
  .ring svg { transform: rotate(-90deg); }
  .ring .score { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:800; }
  .ring .score small { font-size:11px; font-weight:600; color:#999; }
  .analysis { font-size:13.5px; line-height:1.7; color:#4a4460; }
  .analysis .heard { color:#ff3d6e; font-weight:700; }
  .analysis .tip { color:#2f6bff; }
  .speak-status { font-size:12.5px; color:#b93a5e; margin-top:6px; }

  /* 底部 · 三步记忆法 */
  .method {
    background:#fff; border-radius:18px; padding:16px; margin-top:26px;
    box-shadow:0 4px 14px rgba(80,70,180,.08);
  }
  .method h2 { font-size:16px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .step { display:flex; gap:12px; margin-top:12px; }
  .step .num { width:30px; height:30px; border-radius:50%; background:#e6e2ff; color:#5a4cff;
    font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .step b { font-size:14px; }
  .step p { font-size:13px; color:#666b85; margin-top:3px; line-height:1.6; }

  /* 弹层 */
  .overlay { position:fixed; inset:0; background:rgba(20,16,40,.45); z-index:40; display:none;
    align-items:flex-end; justify-content:center; }
  .overlay.show { display:flex; }
  .sheet {
    background:#fff; border-radius:22px 22px 0 0; width:100%; max-width:560px;
    padding:18px 20px 34px; max-height:78vh; overflow-y:auto;
    animation: slideUp .22s ease;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity:0; } to { transform: translateY(0); opacity:1; } }
  .sheet h3 { font-size:17px; font-weight:700; margin-bottom:6px; }
  .sheet .close { float:right; border:none; background:#f0f1f8; width:30px; height:30px; border-radius:9px;
    font-size:15px; color:#666; cursor:pointer; }
  .rule { margin-top:14px; border-left:3px solid #8a2bff; background:#f7f3ff; border-radius:0 10px 10px 0; padding:10px 12px; }
  .rule b { font-size:14px; color:#4a2b8e; }
  .rule .formula { font-size:12.5px; color:#8a2bff; font-weight:700; margin-top:3px; }
  .rule .eg { font-size:12.5px; color:#6a6f8a; margin-top:2px; }

  /* 自测 */
  .quiz-card { background:#fff; border-radius:20px; padding:26px 22px; text-align:center; box-shadow:0 6px 20px rgba(80,70,180,.12); }
  .quiz-word { font-size:34px; font-weight:800; color:#23294a; letter-spacing:1px; }
  .quiz-ipa { font-size:14px; color:#8a8fa8; margin-top:6px; }
  .quiz-meaning { font-size:17px; color:#3a3f5c; margin-top:20px; line-height:1.7; min-height:60px; }
  .quiz-btns { display:flex; gap:10px; margin-top:22px; }
  .quiz-btns .btn { flex:1; padding:13px; font-size:15px; }
  .quiz-progress { font-size:13px; color:#8a8fa8; margin-top:14px; }
  .quiz-hint { font-size:13px; color:#5a5f7a; margin-top:10px; }

  /* 拼写测试 */
  .spell-mean { font-size:22px; font-weight:700; color:#23294a; margin-top:14px; line-height:1.5; }
  .spell-ipa { font-size:14px; color:#8a8fa8; margin-top:4px; }
  .spell-hear { margin-top:14px; border:none; background:#e9f9f0; color:#1f9d63; padding:9px 16px;
    border-radius:12px; font-size:14px; font-weight:600; cursor:pointer; }
  .spell-input { width:100%; box-sizing:border-box; margin-top:16px; padding:13px;
    border:2px solid #e4e6f2; border-radius:14px; font-size:22px; text-align:center;
    letter-spacing:3px; outline:none; font-weight:600; color:#23294a; background:#fbfbfe; }
  .spell-input:focus { border-color:#2fb46b; background:#fff; }
  .letter-row { display:flex; justify-content:center; gap:6px; margin-top:18px; flex-wrap:wrap; }
  .letter-cell { width:30px; height:40px; line-height:40px; border-radius:8px;
    font-size:19px; font-weight:700; text-align:center; }
  .letter-cell.ok { background:#dff6e8; color:#0a8f50; }
  .letter-cell.bad { background:#ffe6e6; color:#d4380d; }
  .spell-msg { font-size:15px; font-weight:700; margin-top:16px; }
  .spell-msg.ok { color:#0a8f50; }
  .spell-msg.bad { color:#d4380d; }
  .spell-answer { font-size:13.5px; color:#8a8fa8; margin-top:8px; }
  .btn.know { background:#dff6e8; color:#0a8f50; }
  .btn.notknow { background:#ffe6e6; color:#d4380d; }
  .btn.reveal { background:#5a4cff; color:#fff; }

  /* 错题本 */
  .btn.wrong { background:#fff5f3; color:#e5484d; }
  .btn.wrong .cnt { display:inline-flex; align-items:center; justify-content:center; min-width:21px; height:21px; padding:0 6px;
    border-radius:11px; background:#e5484d; color:#fff; font-size:12px; font-weight:700; margin-left:6px; }
  .wrong-sum { font-size:13px; color:#8a8fa8; margin-bottom:12px; line-height:1.7; }
  .wrong-row { display:flex; align-items:center; gap:10px; background:#faf9ff; border:1px solid #eceef7;
    border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .wrong-row .w { font-size:16px; font-weight:700; color:#23294a; min-width:92px; }
  .wrong-row .m { flex:1; font-size:12.5px; color:#6a6f8a; line-height:1.5; }
  .wrong-row .stk { font-size:11.5px; color:#e5484d; font-weight:600; margin-left:4px; }
  .wrong-master { border:none; background:#dff6e8; color:#0a8f50; border-radius:9px; padding:7px 11px;
    font-size:12.5px; font-weight:600; cursor:pointer; flex-shrink:0; }
  .wrong-actions { display:flex; gap:10px; margin-top:16px; }
  .wrong-actions .btn { flex:1; }
  .wrong-empty { text-align:center; color:#a5a8bd; font-size:13.5px; padding:26px 0; line-height:1.8; }

  .toast {
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    background:#2a2140; color:#fff; padding:11px 18px; border-radius:12px; font-size:13.5px; z-index:60;
    opacity:0; pointer-events:none; transition: opacity .2s;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>

<div class="header">
  <h1>📘 小升初英语单词讲义</h1>
  <p id="wordCount">18 个核心词 · 自然拼读 · 发音检测 · 记忆讲解，跟着读、对着练</p>
  <div class="actions">
    <button class="btn primary" id="quizBtn">🎮 自测模式</button>
    <button class="btn primary" id="spellBtn" style="background:#2fb46b">✏️ 拼写测试</button>
    <button class="btn ghost" id="rulesBtn">🔤 拼读规则</button>
    <button class="btn wrong" id="wrongBtn">📕 错题本<span class="cnt" id="wrongCount">0</span></button>
  </div>
</div>

<div class="wrap" id="app">
  <!-- 单词卡片按数据渲染 -->
</div>

<!-- 三步记忆法 -->
<div class="wrap">
  <div class="method">
    <h2>🧠 三步记忆法</h2>
    <div class="step"><div class="num">1</div><div><b>听音跟读</b><p>先听单词和中文讲解，跟读 3 遍。读的时候注意口型和重音。</p></div></div>
    <div class="step"><div class="num">2</div><div><b>拼读拆解</b><p>用「完整流程」听自然拼读：分组读音 → 组内拼字母 → 整词 → 逐字母拼一遍。把发音和拼写绑在一起记。</p></div></div>
    <div class="step"><div class="num">3</div><div><b>自测巩固</b><p>进「自测模式」打乱顺序测一遍，不会的词标出来，回头再练。当天睡前再看一眼，记得最牢。</p></div></div>
  </div>
</div>

<!-- 拼读规则弹层 -->
<div class="overlay" id="rulesOverlay">
  <div class="sheet">
    <h3>🔤 本课拼读规则 <button class="close" data-close="rulesOverlay">✕</button></h3>
    <div id="rulesList"></div>
  </div>
</div>

<!-- 自测弹层 -->
<div class="overlay" id="quizOverlay">
  <div class="sheet" style="background:transparent;padding:10px 14px;">
    <div id="quizBody"></div>
  </div>
</div>

<!-- 拼写测试弹层 -->
<div class="overlay" id="spellOverlay">
  <div class="sheet" style="background:transparent;padding:10px 14px;">
    <div id="spellBody"></div>
  </div>
</div>

<!-- 错题本弹层 -->
<div class="overlay" id="wrongOverlay">
  <div class="sheet">
    <h3>📕 错题本 <button class="close" data-close="wrongOverlay">✕</button></h3>
    <div class="wrong-sum" id="wrongSum"></div>
    <div id="wrongList"></div>
    <div class="wrong-actions">
      <button class="btn reveal" id="wrongPracticeBtn" style="background:#e5484d">🔁 反复练习</button>
      <button class="btn ghost" id="wrongClearBtn" style="background:#f0f1f8;color:#666">🗑 清空</button>
    </div>
  </div>
</div>

<!-- 错题练习弹层 -->
<div class="overlay" id="wrongPracticeOverlay">
  <div class="sheet" style="background:transparent;padding:10px 14px;">
    <div id="wrongPracticeBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ================= 数据 =================
   每个词条：word 单词 / ipa 音标 / meaning 中文释义 / cat 板块 /
   tips 记忆讲解 / example 例句 / derivatives 衍生词[词,释义] /
   phrases 常用短语[短语,释义] / chunks 拼读拆解[{letters,ipa,rule,sound}] /
   speaTips 发音建议 / spelling 逐字母拼写（自动生成）
   板块：basic = 基本信息，like = 性格与喜好 */
const WORDS = [
  {
    word:"introduce", ipa:"/ˌɪntrəˈdjuːs/", meaning:"v. 介绍",
    cat:"basic",
    tips:"拆词根：intro（向内）+ duce（引导）→ 把对方“引导”进你的世界 → 介绍。同根词：produce 生产（向前引导）、reduce 减少（向后拉）。",
    example:"Let me introduce my friend to you. 让我把我朋友介绍给你。",
    derivatives:[["introduction","n. 介绍"],["self-introduction","n. 自我介绍"],["introducer","n. 介绍人"]],
    phrases:[["introduce oneself","自我介绍"],["introduce A to B","把 A 介绍给 B"]],
    chunks:[
      {letters:"in",  ipa:"/ɪn/",    rule:"短音 i",      sound:"in"},
      {letters:"tro", ipa:"/trə/",   rule:"弱读 o",      sound:"truh"},
      {letters:"duce",ipa:"/djuːs/", rule:"魔法 e：u-e→/juː/", sound:"dyooss"}
    ],
    speaTips:"重音在第三个音节 duce 上，前面弱读：in-tro-DUCE，别把 i 读成重音。"
  },
  {
    word:"name", ipa:"/neɪm/", meaning:"n. 名字",
    cat:"basic",
    tips:"魔法 e：a_e → /eɪ/，结尾 e 不发音，把前面的 a 变成长音。N-A-M-E，e 是“小帮手”，不读出来。",
    example:"My name is Lily. 我的名字叫莉莉。",
    derivatives:[["named","adj. 名为……的"],["nameless","adj. 无名的"],["rename","v. 重命名"]],
    phrases:[["first name","名"],["last name / family name","姓"],["a name card","一张名片"]],
    chunks:[
      {letters:"n",   ipa:"/n/",    rule:"鼻音 n",        sound:"nn"},
      {letters:"ame", ipa:"/eɪm/",  rule:"魔法 e：a_e→/eɪ/", sound:"aim"}
    ],
    speaTips:"双元音 /eɪ/ 要读到位：从 /e/ 慢慢滑向 /ɪ/，嘴形变扁。"
  },
  {
    word:"country", ipa:"/ˈkʌntri/", meaning:"n. 国家",
    cat:"basic",
    tips:"count（数）+ ry：数也数不清的疆域，就是“国家”。注意：这里的 ou 发 /ʌ/（像“啊”），不是 /aʊ/（像“奥”）。",
    example:"China is a big country. 中国是一个大国。",
    derivatives:[["countryside","n. 乡村"],["countries","n. 复数形式"],["fellow countryman","n. 同胞"]],
    phrases:[["our country","我们的国家"],["country music","乡村音乐"],["all over the country","全国"]],
    chunks:[
      {letters:"coun", ipa:"/kʌn/", rule:"ou→/ʌ/",        sound:"cun"},
      {letters:"try",  ipa:"/tri/", rule:"tr 组合 /tr/",  sound:"tree"}
    ],
    speaTips:"重音在第一音节 coun，ou 读短 /ʌ/；后半截 try 轻一点。"
  },
  {
    word:"classmate", ipa:"/ˈklɑːsmeɪt/", meaning:"n. 同班同学",
    cat:"basic",
    tips:"合成词：class（班级）+ mate（同伴）→ 同班同学。mate 家族一起记：classmate 同学、roommate 室友、teammate 队友。",
    example:"She is my new classmate. 她是我的新同学。",
    derivatives:[["classmates","n. 复数形式"],["roommate","n. 室友"],["teammate","n. 队友"]],
    phrases:[["my classmate","我的同学"],["old classmates","老同学"]],
    chunks:[
      {letters:"class", ipa:"/klɑːs/", rule:"cl 组合 /kl/",  sound:"class"},
      {letters:"mate",  ipa:"/meɪt/",  rule:"魔法 e：a_e→/eɪ/", sound:"mate"}
    ],
    speaTips:"两个音节，重音在 class 上；mate 的 /eɪ/ 要读长一点。"
  },
  {
    word:"friend", ipa:"/frend/", meaning:"n. 朋友",
    cat:"basic",

const RULES = [
  { name:"魔法 e（a_e / i_e / u_e）", formula:"字母 + e → 前面的元音变长音", eg:"name n-e→/eɪ/，like l-i-k-e→/aɪ/，duce d-u-c-e→/juː/；结尾 e 本身不发音" },
  { name:"双写辅音", formula:"辅音字母 + 短元音 → 辅音双写", eg:"different 里 dif 的 f：短音 i 后面的辅音自然加重" },
  { name:"oo 的两种发音", formula:"oo → 长音 /uː/ 或短音 /ʊ/", eg:"school /uː/，book /ʊ/——靠多读记住" },
  { name:"ch 组合", formula:"ch → /tʃ/", eg:"China /ˈtʃaɪnə/，ch 像“吃”的开头" },
  { name:"ou 多音", formula:"ou → 多数 /aʊ/，本课 country 里读 /ʌ/", eg:"country coun 发 /kʌn/，不是“考恩”" },

const $ = s => document.querySelector(s);
const el = (tag, cls, html) => {
  const n = document.createElement(tag);

let toastTimer;
function toast(msg){
  const t = $("#toast");

/* ================= 语音引擎 ================= */
let voiceEn = null, voiceZh = null;
const FEMALE_RE=/Samantha|Karen|Moira|Fiona|Victoria|Susan|Tessa|Rishi|Kate|Veena|Zira|Allison|Aria|Ava|Emma|Libby|Jenny|Sonia|Hazel|Georgia|Nathalie|Olivia|Nicky|Catherine|Daria|Zo[eë]|Zuzana|Yuna|Claire|Elena|Marta|Serena|Paulina|Hannah|Google US English|Google UK English|Ting-?Ting|Li-?mu|Sin-?ji|Mei-?Jia|Lili|Xiaoxiao|Xiaoyi|Huihui|Yaoyao|普通话|female/i;
function isFemale(v){ return FEMALE_RE.test(v.name||"") && !/male/i.test(v.name||""); }
function pickFemale(list){
  return list.find(v=>isFemale(v) && /US|America/i.test(v.name)) || list.find(isFemale) || null;
}
function loadVoices(){
  const vs = speechSynthesis.getVoices();
  const en = vs.filter(v=>v.lang && v.lang.toLowerCase().startsWith("en"));
  const zh = vs.filter(v=>v.lang && (v.lang.toLowerCase().startsWith("zh")||v.lang.toLowerCase().startsWith("cmn")));
  voiceEn = pickFemale(en) || en.find(v=>v.lang && v.lang.toLowerCase().startsWith("en") && /US|America/i.test(v.name)) || en[0] || vs[0];
  voiceZh = pickFemale(zh) || zh[0] || vs.find(v=>v.lang && v.lang.toLowerCase().startsWith("cmn"));
}
if (window.speechSynthesis) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text, rate, pitch){
  if(!window.speechSynthesis){ toast("当前浏览器不支持语音朗读"); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.rate = rate != null ? rate : 0.85;
  u.pitch = pitch != null ? pitch : 1;
  u.voice = /[一-鿿]/.test(text) ? (voiceZh||voiceEn) : voiceEn;
  speechSynthesis.speak(u);
  return u;
}
function stopSpeak(){
  if(window.speechSynthesis) speechSynthesis.cancel();
}

/* ================= 拼读流程引擎 ================= */
let queue = [], queueRunning = false, currentCard = null;
function clearQueue(){ queue = []; queueRunning = false; currentCard = null; }

function runPhonics(w, mode, setLive, cardEl){
  stopSpeak(); clearQueue();
  currentCard = cardEl;
  if(cardEl && !cardEl.classList.contains("open")){
    cardEl.classList.add("open");
    const tg = cardEl.querySelector(".toggle.expand");
    if(tg) tg.textContent = "收起";
  }
  const chunks = w.chunks.map(c=>({...c, letters:[...c.letters]}));
  if (mode === "full") {
    chunks.forEach(ch=>{
      queue.push({t:"chunkSound", ch});
      ch.letters.forEach((L,li)=> queue.push({t:"chunkLetter", ch, L, li}));
    });
    queue.push({t:"word", text:w.word});
    [...w.word].forEach(L=> queue.push({t:"wholeLetter", L}));
    queue.push({t:"word", text:w.word, glow:true});
  } else {
    [...w.word].forEach(L=> queue.push({t:"wholeLetter", L}));
    queue.push({t:"word", text:w.word});
  }
  queueRunning = true;
  stepQueue(setLive);
}

function findChunk(letters){
  if(!currentCard) return null;
  const key = letters.join("");
  return [...currentCard.querySelectorAll(".chunk")].find(n=>
    (n.querySelector(".ch-letters").textContent||"").replace(/\s+/g,"") === key);
}

function stepQueue(setLive){
  if(!queue.length || !queueRunning){
    queueRunning = false; clearActive();
    if(currentCard){ const b = currentCard.querySelector(".phonics-btn.full"); if(b) b.classList.remove("glowing"); }
    if(setLive) setLive("完成 ✅");
    currentCard = null;
    return;
  }
  const it = queue.shift();
  const qc = currentCard ? currentCard.querySelector(".phonics-btn.full") : null;

  if (it.t === "chunkSound") {
    clearActive();
    const cn = findChunk(it.ch.letters);
    if(cn) cn.classList.add("active");
    if(setLive) setLive(`🔊 读音 ${it.ch.letters.join("")}（${it.ch.ipa}）`);
    const u = speak(it.ch.sound, 0.6, 0.9);
    u.onend = ()=> setTimeout(()=>stepQueue(setLive), 80);
  }
  else if (it.t === "chunkLetter") {
    clearActive();
    const cn = findChunk(it.ch.letters);
    if(cn){
      cn.classList.add("letter-active");
      const span = cn.querySelector(`[data-l="${it.li}"]`);
      if(span) span.classList.add("lit");
    }
    if(setLive) setLive(`✍️ 拼写 ${it.ch.letters.join("")}：${it.L.toUpperCase()}`);
    const u = speak(it.L.toUpperCase(), 0.8, 1.05);
    u.onend = ()=> setTimeout(()=>stepQueue(setLive), 60);
  }
  else if (it.t === "wholeLetter") {
    clearActive();
    if(setLive) setLive(`🔡 整词拼写：${it.L.toUpperCase()}`);
    const u = speak(it.L.toUpperCase(), 0.8, 1.05);
    u.onend = ()=> setTimeout(()=>stepQueue(setLive), 55);
  }
  else if (it.t === "word") {
    clearActive();
    if(it.glow && qc) qc.classList.add("glowing");
    if(setLive) setLive(it.glow ? `⭐ 整词：${it.text}` : `🔊 ${it.text}`);
    const u = speak(it.text, 0.75);
    u.onend = ()=>{ if(qc) qc.classList.remove("glowing"); setTimeout(()=>stepQueue(setLive), 120); };
  }
}

function clearActive(){
  if(!currentCard) return;
  currentCard.querySelectorAll(".chunk").forEach(n=>{
    n.classList.remove("active","letter-active");
    n.querySelectorAll(".lit").forEach(s=>s.classList.remove("lit"));
  });
}

/* ================= 发音检测 ================= */
function checkSpeak(w, card){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const statusEl = card.querySelector(".speak-status");
  const resultEl = card.querySelector(".speak-result");
  resultEl.classList.remove("show");
  if(!SR){
    statusEl.textContent = "⚠️ 这个浏览器不支持语音识别。请用电脑 Chrome 或安卓浏览器打开，iPhone Safari 暂不支持录音识别。";
    return;
  }
  statusEl.textContent = "🎙 请对准麦克风读这个单词…";
  const rec = new SR();
  rec.lang = "en-US";
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onerror = e => {
    if(e.error==="not-allowed"||e.error==="service-not-allowed") statusEl.textContent = "需要允许麦克风权限才能测发音。";
    else if(e.error==="no-speech") statusEl.textContent = "没听清，再点一次试试。";
    else statusEl.textContent = "识别出错了（"+e.error+"），再试一次。";
  };
  rec.onresult = e => {
    const heard = (e.results[0][0].transcript||"").trim().toLowerCase();
    const target = w.word.toLowerCase();
    const score = wordScore(heard, target);
    resultEl.innerHTML = ringHTML(score) + `
      <div class="analysis">
        <div>我们听到的是：<span class="heard">“${heard||"—"}”</span>（目标：${w.word}）</div>
        <div class="tip" style="margin-top:6px">💬 ${score>=80 ? "很棒，发音已经很标准了！" : score>=55 ? "不错，离标准只差一点点，重点练下面这几点：" : "再练练，重点看下面这几点："}</div>
        <div class="tip">${w.speaTips}</div>
      </div>`;
    resultEl.classList.add("show");
    statusEl.textContent = "";
  };
  try { rec.start(); } catch(err){ statusEl.textContent = "无法启动录音，请换浏览器再试。"; }
}

function wordScore(heard, target){
  if(!heard) return 0;
  if(heard === target) return 100;
  if(heard.includes(target) || target.includes(heard)) return 88;
  const dist = levenshtein(heard, target);
  const max = Math.max(heard.length, target.length);
  return Math.max(0, Math.round(100 * (1 - dist/max)));
}
function levenshtein(a,b){
  const m=a.length, n=b.length, d=Array.from({length:m+1},(_,i)=>[i]);
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function ringHTML(score){
  const r=30, c=2*Math.PI*r, off=c*(1-score/100);
  const color = score>=80 ? "#0a8f50" : score>=55 ? "#ff8f1f" : "#ff3d6e";
  return `<div class="ring-wrap">
    <div class="ring">
      <svg width="72" height="72" viewBox="0 0 72 72">
        <circle cx="36" cy="36" r="${r}" fill="none" stroke="#f0f1f8" stroke-width="7"/>
        <circle cx="36" cy="36" r="${r}" fill="none" stroke="${color}" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
      </svg>
      <div class="score">${score}<small>分</small></div>
    </div>
    <div style="font-size:13px;color:#8a8fa8">发音匹配度<br>（与标准发音的接近程度）</div>
  </div>`;
}

/* ================= 错题本（收集错词·反复练习） ================= */
const WRONG_KEY = "vocab_wrong";
let wrongStore = [];
(function(){
  try { wrongStore = JSON.parse(localStorage.getItem(WRONG_KEY)||"[]") || []; }
  catch(e){ wrongStore = []; }
  if(!Array.isArray(wrongStore)) wrongStore = [];
})();
function saveWrong(){
  try { localStorage.setItem(WRONG_KEY, JSON.stringify(wrongStore)); } catch(e){}
  updateWrongBadge();
}
function wrongInfo(word){ return wrongStore.find(x=>x.word===word); }
function addWrong(word){
  const it = wrongInfo(word);
  if(it){ it.streak = 0; }
  else { wrongStore.push({word, streak:0}); }
  saveWrong();
  renderWrongList();
}
function markMastered(word){
  wrongStore = wrongStore.filter(x=>x.word!==word);
  saveWrong();
  renderWrongList();
}
function clearWrong(){
  wrongStore = [];
  saveWrong();
  renderWrongList();
  toast("错题已清空");
}
function updateWrongBadge(){
  const b = $("#wrongCount");
  if(b) b.textContent = wrongStore.length;
}
function renderWrongList(){
  const listEl = $("#wrongList");
  const sumEl = $("#wrongSum");
  const n = wrongStore.length;
  if(sumEl) sumEl.textContent = n
    ? `已收集 ${n} 个没记住的词。反复练习时，一个词连对 2 次就会自动移出。`
    : "还没有错题。自测、拼写测试里没答对的词会自动收进来。";
  const pb = $("#wrongPracticeBtn");
  if(pb) pb.style.opacity = n ? 1 : .45;
  if(!n){
    if(listEl) listEl.innerHTML = `<div class="wrong-empty">✅ 目前没有错题<br>在「自测模式」或「拼写测试」中答错的词会自动收进来</div>`;
    return;
  }
  listEl.innerHTML = wrongStore.map(x=>{
    const w = WORDS.find(d=>d.word===x.word);
    if(!w) return "";
    return `<div class="wrong-row">
      <div class="w">${w.word}</div>
      <div class="m">${w.meaning}<span class="stk">已连对 ${x.streak}/2</span></div>
      <button class="wrong-master" data-master="${w.word}">✅ 记住了</button>
    </div>`;
  }).join("");
}

});

/* 错题反复练习：走拼写流程，一个词连对 2 次就移出错题本 */
const wq = { list:[], idx:0, total:0, mastered:0, checked:false, lastOk:false, lastTyped:"" };
function startWrongPractice(){
  if(!wrongStore.length){ toast("错题本是空的，先去自测或拼写收集吧"); return; }
  wq.list = wrongStore.map(x=>x.word)
    .sort(()=>Math.random()-0.5)

    .filter(Boolean)
    .map(w=>({w}));

  wq.checked = false; wq.lastOk = false; wq.lastTyped = "";
  $("#wrongPracticeOverlay").classList.add("show");
  renderWrongPractice();
}
function renderWrongPractice(){
  const body = $("#wrongPracticeBody");
  if(wq.idx >= wq.total){
    const left = wrongStore.length;
    body.innerHTML = `<div class="quiz-card">
      <div style="font-size:46px">${left===0?"🏆":wq.mastered?"👍":"💪"}</div>
      <h3 style="margin:10px 0 4px">本轮练习完成！</h3>
      <p style="color:#666">这轮掌握 <b style="color:#e5484d">${wq.mastered}</b> 个，错题本还剩 <b>${left}</b> 个</p>
      <p style="font-size:12.5px;color:#999;margin-top:6px">${left===0 ? "全部记住啦 🎉" : "再点「反复练习」，把剩下的词连对 2 次，直到全部清空。"}</p>

      </div>
    </div>`;
    $("#wpAgain").onclick = startWrongPractice;
    return;
  }
  const {w} = wq.list[wq.idx];
  if(!wq.checked){
    body.innerHTML = `<div class="quiz-card">
      <div class="quiz-progress">错题 ${wq.idx+1} / ${wq.total} · 本轮已掌握 ${wq.mastered}</div>
      <div class="spell-mean">${w.meaning}</div>
      <div class="spell-ipa">${w.ipa}</div>
      <div><button class="spell-hear" id="wpHear">🔊 听一遍</button></div>
      <input class="spell-input" id="wpInput" placeholder="打出这个英文单词…" autocapitalize="none" autocorrect="off" spellcheck="false">
      <div class="spell-msg" id="wpMsg"></div>
      <div class="quiz-btns"><button class="btn reveal" id="wpCheck" style="background:#e5484d">✅ 检查</button></div>
      <div class="quiz-hint">看中文拼写。连对 2 次，这个词就会移出错题本。</div>
    </div>`;
    $("#wpHear").onclick = ()=>{ stopSpeak(); speak(w.word, 0.75); };
    const inp = $("#wpInput");
    if(inp && inp.focus) inp.focus();
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter") checkWrongPractice(w); });
    $("#wpCheck").onclick = ()=> checkWrongPractice(w);
  } else {
    body.innerHTML = `<div class="quiz-card">
      <div class="quiz-progress">错题 ${wq.idx+1} / ${wq.total} · 本轮已掌握 ${wq.mastered}</div>
      <div class="spell-mean">${w.meaning}</div>
      <div class="spell-ipa">${w.ipa}</div>
      <div><button class="spell-hear" id="wpHear2">🔊 再听一遍</button></div>
      <div class="letter-row">${letterCells(w, wq.lastTyped)}</div>
      <div class="spell-msg ${wq.lastOk?"ok":"bad"}">${wq.lastOk ? "✅ 拼对了！这个词的连对进度 +1" : "😅 没拼对，连对进度归零，红色字母是要记住的位置"}</div>
      ${wq.lastOk ? "" : `<div class="spell-answer">正确答案：<b>${w.word}</b> ${w.ipa}</div>`}
      <div class="quiz-btns"><button class="btn reveal" id="wpNext" style="background:#e5484d">下一题 ➡</button></div>
    </div>`;
    $("#wpHear2").onclick = ()=>{ stopSpeak(); speak(w.word, 0.75); };
    $("#wpNext").onclick = ()=>{ wq.checked=false; wq.lastTyped=""; wq.idx++; renderWrongPractice(); };
  }
}
function checkWrongPractice(w){
  const inp = $("#wpInput");
  const val = (inp && inp.value ? inp.value : "").trim().toLowerCase();
  if(!val){ toast("先打出单词再检查"); if(inp && inp.focus) inp.focus(); return; }
  wq.lastTyped = val;
  wq.lastOk = (val === w.word);
  wq.checked = true;
  const it = wrongInfo(w.word);
  if(wq.lastOk && it){
    it.streak++;
    if(it.streak >= 2){
      wrongStore = wrongStore.filter(x=>x.word!==w.word);
      wq.mastered++;
      saveWrong();
      renderWrongPractice();
      toast("🎉 "+w.word+" 已掌握，移出错题本！");
      return;
    }
  } else if(!wq.lastOk && it){
    it.streak = 0;
  }
  saveWrong();
  renderWrongPractice();
}

      <div><button class="spell-hear" id="spellHear2">🔊 再听一遍</button></div>
      <div class="letter-row">${letterCells(w, spell.lastTyped)}</div>
      <div class="spell-msg ${spell.lastOk?"ok":"bad"}">${spell.lastOk?"🎉 拼对了！":"😅 没拼对，已收进错题本，红色字母是要记住的位置"}</div>
      ${spell.lastOk?"":`<div class="spell-answer">正确答案：<b>${w.word}</b> ${w.ipa}</div>`}
      <div class="quiz-btns"><button class="btn reveal" id="spellNext" style="background:#2fb46b">下一题 ➡</button></div>
    </div>`;
    $("#spellHear2").onclick = ()=>{ stopSpeak(); speak(w.word, 0.75); };
    $("#spellNext").onclick = ()=>{ spell.checked=false; spell.lastTyped=""; spell.idx++; renderSpell(); };
  }
}

function checkSpell(w){
  const inp = $("#spellInput");
  const val = (inp && inp.value ? inp.value : "").trim().toLowerCase();
  if(!val){ toast("先打出单词再检查"); if(inp && inp.focus) inp.focus(); return; }
  spell.lastTyped = val;
  spell.lastOk = (val === w.word);
  if(spell.lastOk) spell.score++;
  else addWrong(w.word); // 拼错 → 收进错题本
  spell.checked = true;
  renderSpell();
}

/* ================= 拼读规则面板 ================= */
(function(){
  const list = $("#rulesList");
  RULES.forEach(r=>{
    list.appendChild(el("div","rule", `<b>${r.name}</b><div class="formula">${r.formula}</div><div class="eg">例：${r.eg}</div>`));
  });
})();

/* ================= 启动 ================= */
(function(){
  const wc = $("#wordCount");
  if(wc) wc.textContent = WORDS.length + " 个核心词 · 自然拼读 · 发音检测 · 记忆讲解，跟着读、对着练";
})();
renderAll();
</script>
