<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小升初英语 · 基础闯关</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { font-size:16px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
    background: linear-gradient(180deg,#f3f6ff 0%, #eef1fb 100%);
    color:#2d3350; min-height:100vh; padding-bottom:60px;
  }
  .header {
    background: linear-gradient(135deg,#5f3dc4 0%, #8a5cf6 55%, #b388ff 100%);
    color:#fff; padding:26px 20px 22px; border-radius:0 0 28px 28px;
    box-shadow:0 8px 24px rgba(95,61,196,.28);
  }
  .header h1 { font-size:21px; font-weight:800; letter-spacing:.5px; }
  .header p { margin-top:6px; font-size:12.5px; opacity:.92; line-height:1.5; }
  .hdr-btns { display:flex; gap:9px; margin-top:14px; flex-wrap:wrap; }
  .btn {
    border:none; border-radius:12px; padding:11px 15px; font-size:13.5px; font-weight:700;
    cursor:pointer; transition: transform .08s ease; -webkit-user-select:none; user-select:none;
  }
  .btn:active { transform: scale(.95); }
  .btn.white { background:#fff; color:#5f3dc4; box-shadow:0 3px 10px rgba(0,0,0,.15); }
  .btn.ghost { background:rgba(255,255,255,.16); color:#fff; }
  .btn.pink { background:#ff5c8a; color:#fff; }
  .btn.green { background:#2fb46b; color:#fff; }
  .btn.grey { background:#eef0f8; color:#5a5f7a; }
  .btn:disabled { opacity:.45; }

  .wrap { padding:18px 16px; }
  .card {
    background:#fff; border-radius:18px; padding:16px; margin-bottom:12px;
    box-shadow:0 4px 14px rgba(80,70,180,.08);
  }
  .section-title { display:flex; align-items:center; justify-content:space-between; margin:6px 0 12px; }
  .section-title h2 { font-size:16px; font-weight:800; }
  .badge { font-size:12px; font-weight:700; color:#5f3dc4; background:#ece5ff; border-radius:20px; padding:3px 10px; }

  /* 课程地图 */
  .stat-row { display:flex; gap:10px; margin-bottom:14px; }
  .stat { flex:1; background:#fff; border-radius:16px; padding:12px 14px; text-align:center; box-shadow:0 4px 14px rgba(80,70,180,.08); }
  .stat b { font-size:20px; color:#5f3dc4; display:block; }
  .stat span { font-size:11.5px; color:#8a8fa8; }
  .l-card { display:flex; align-items:center; gap:12px; background:#fff; border-radius:18px; padding:14px 16px; margin-bottom:11px;
    box-shadow:0 4px 14px rgba(80,70,180,.08); cursor:pointer; border:2px solid transparent; }
  .l-card.done { border-color:#dff6e8; }
  .l-card .icon { width:46px; height:46px; border-radius:14px; background:#f1ecff; display:flex; align-items:center; justify-content:center; font-size:23px; flex-shrink:0; }
  .l-card .info { flex:1; min-width:0; }
  .l-card .t { font-size:15.5px; font-weight:800; }
  .l-card .s { font-size:11.5px; color:#9a9fb8; margin-top:2px; }
  .l-card .stars { font-size:13px; color:#ffb800; margin-top:4px; letter-spacing:1px; }
  .l-card .go { color:#5f3dc4; font-size:14px; font-weight:800; }

  /* 步骤指示 */
  .steps { display:flex; gap:4px; margin-bottom:14px; }
  .step { flex:1; text-align:center; padding:7px 2px; border-radius:11px; font-size:11px; font-weight:700;
    background:#eceff8; color:#9a9fb8; }
  .step.on { background:#5f3dc4; color:#fff; }
  .step.done { background:#dff6e8; color:#0a8f50; }

  /* 关卡顶栏 */
  .lesson-top { display:flex; align-items:center; gap:10px; margin:4px 0 14px; }
  .back { border:none; background:#fff; border-radius:12px; width:40px; height:40px; font-size:17px; cursor:pointer; box-shadow:0 3px 10px rgba(80,70,180,.12); }
  .lesson-top .ti { flex:1; min-width:0; }
  .lesson-top .ti b { font-size:16px; font-weight:800; display:block; }
  .lesson-top .ti span { font-size:11.5px; color:#8a8fa8; }
  .stage-tag { font-size:11.5px; font-weight:800; color:#5f3dc4; background:#ece5ff; border-radius:20px; padding:4px 12px; margin-bottom:10px; display:inline-block; }

  /* 单词卡 */
  .w-card { text-align:center; padding:30px 20px 24px; }
  .w-word { font-size:38px; font-weight:800; color:#23294a; letter-spacing:1px; }
  .w-ipa { font-size:15px; color:#8a8fa8; margin-top:8px; }
  .w-sound { margin-top:14px; border:none; background:#f1ecff; color:#5f3dc4; padding:11px 20px; border-radius:14px; font-size:15px; font-weight:700; cursor:pointer; }
  .w-meaning { display:none; margin-top:20px; }
  .w-meaning.show { display:block; }
  .w-meaning .m { font-size:21px; font-weight:800; color:#5f3dc4; }
  .w-meaning .ex { font-size:14.5px; color:#3a4466; margin-top:12px; line-height:1.7; }
  .w-meaning .tip { font-size:13px; color:#8a6bff; background:#f6f2ff; border-radius:10px; padding:9px 12px; margin-top:12px; line-height:1.6; }
  .w-btns { display:flex; gap:10px; margin-top:22px; }
  .w-btns .btn { flex:1; padding:14px; font-size:15px; }
  .w-prog { font-size:12.5px; color:#9a9fb8; margin-top:14px; }

  /* 公式/表格 */
  .f-title { font-size:16px; font-weight:800; margin-bottom:4px; }
  .f-sub { font-size:12px; color:#8a8fa8; margin-bottom:14px; }
  .tbl { width:100%; border-collapse:collapse; margin-bottom:12px; }
  .tbl th, .tbl td { border:1px solid #e4e6f2; padding:9px 6px; text-align:center; font-size:14px; }
  .tbl th { background:#f4f1ff; color:#5f3dc4; font-weight:800; }
  .tbl td.lbl { background:#faf8ff; color:#9a9fb8; font-size:12px; font-weight:700; }
  .formula { background:#5f3dc4; color:#fff; border-radius:13px; padding:12px 14px; font-size:14.5px; font-weight:700; margin:6px 0 12px; line-height:1.6; }
  .note { background:#fff8e6; border-left:3px solid #ffb800; border-radius:0 11px 11px 0; padding:10px 13px; font-size:13.5px; color:#7a5d00; line-height:1.7; }
  .f-sent { margin-top:14px; border-top:1px dashed #e6e8f2; padding-top:12px; }
  .f-sent .lbl { font-size:12px; color:#8a8fa8; font-weight:700; margin-bottom:8px; }
  .f-sent .one { font-size:14.5px; color:#3a4466; padding:7px 0; border-bottom:1px dashed #f0f1f8; display:flex; align-items:center; gap:8px; }
  .f-sent .one:last-child { border-bottom:none; }
  .say { margin-left:auto; border:none; background:#f1ecff; color:#5f3dc4; width:34px; height:34px; border-radius:10px; cursor:pointer; font-size:14px; flex-shrink:0; }

  /* 跟读句 */
  .line-card { text-align:center; padding:34px 20px; }
  .line-zh { font-size:22px; font-weight:800; color:#23294a; line-height:1.6; }
  .line-en { display:none; margin-top:18px; font-size:19px; font-weight:700; color:#5f3dc4; line-height:1.6; }
  .line-en.show { display:block; }
  .line-en .snd { margin-top:10px; border:none; background:#f1ecff; color:#5f3dc4; padding:10px 18px; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; }

  /* 题目 */
  .q-card { padding:20px 18px; }
  .q-num { font-size:12px; color:#9a9fb8; font-weight:700; margin-bottom:6px; }
  .q-text { font-size:16px; font-weight:700; color:#23294a; line-height:1.7; margin-bottom:14px; }
  .q-bank { font-size:13px; color:#8a6bff; background:#f6f2ff; border-radius:10px; padding:9px 12px; margin-bottom:13px; line-height:1.7; }
  .opts { display:flex; flex-direction:column; gap:9px; }
  .opt { border:2px solid #e4e6f2; border-radius:13px; padding:12px 14px; font-size:15px; text-align:left; background:#fff; cursor:pointer; line-height:1.6; }
  .opt:active { transform: scale(.98); }
  .opt.sel-right { border-color:#2fb46b; background:#e9f9f0; color:#0a8f50; font-weight:700; }
  .opt.sel-wrong { border-color:#ff5c8a; background:#ffe9f0; color:#d4380d; }
  .opt.dim { opacity:.5; }
  .fill-row { display:flex; gap:9px; }
  .fill-in { flex:1; border:2px solid #e4e6f2; border-radius:13px; padding:13px; font-size:17px; font-weight:700; text-align:center; outline:none; color:#23294a; background:#fbfbfe; }
  .fill-in:focus { border-color:#5f3dc4; background:#fff; }
  .q-feedback { display:none; margin-top:14px; border-radius:13px; padding:12px 14px; }
  .q-feedback.show { display:block; }
  .q-feedback.ok { background:#e9f9f0; border:1px solid #bfe9d0; }
  .q-feedback.bad { background:#fff1f5; border:1px solid #ffc6d6; }
  .q-feedback .v { font-size:16px; font-weight:800; }
  .q-feedback.ok .v { color:#0a8f50; }
  .q-feedback.bad .v { color:#d4380d; }
  .q-feedback .why { font-size:13.5px; color:#3a4466; margin-top:7px; line-height:1.7; }
  .q-hint { margin-top:11px; border:none; background:#fff8e6; color:#b07d00; padding:9px 14px; border-radius:11px; font-size:13px; font-weight:700; cursor:pointer; }
  .q-hint-box { display:none; margin-top:10px; background:#fff8e6; border-radius:11px; padding:10px 13px; font-size:13.5px; color:#7a5d00; line-height:1.7; }
  .q-hint-box.show { display:block; }

  /* 完成页 */
  .done-card { text-align:center; padding:32px 20px; }
  .done-big { font-size:54px; }
  .done-title { font-size:20px; font-weight:800; margin-top:6px; }
  .done-stars { font-size:30px; color:#ffb800; margin-top:10px; letter-spacing:4px; }
  .done-sub { font-size:13.5px; color:#8a8fa8; margin-top:8px; line-height:1.6; }

  /* 老师要点 */
  .t-block { border-radius:14px; padding:12px 14px; margin-bottom:11px; }
  .t-goal { background:#eef4ff; }
  .t-goal b { color:#2f6bff; }
  .t-trap { background:#fff1f5; }
  .t-trap b { color:#ff3d6e; }
  .t-say { background:#e9f9f0; }
  .t-say b { color:#1f9d63; }
  .t-block b { display:block; font-size:12.5px; margin-bottom:6px; }
  .t-block p { font-size:13.5px; line-height:1.7; color:#3a4466; }
  .t-block li { font-size:13.5px; line-height:1.7; color:#3a4466; margin-left:18px; }

  /* 错题本 */
  .wr-item { background:#fff; border-radius:14px; padding:12px 14px; margin-bottom:10px; }
  .wr-item .lbl { font-size:11.5px; color:#9a9fb8; margin-bottom:4px; }
  .wr-item .q { font-size:14px; font-weight:700; color:#23294a; line-height:1.6; }
  .wr-item .a { font-size:13px; color:#0a8f50; margin-top:5px; }
  .wr-item .why { font-size:12.5px; color:#7a7f9c; margin-top:5px; line-height:1.6; }
  .empty { text-align:center; color:#9a9fb8; font-size:14px; padding:34px 0; }

  /* 弹层 */
  .overlay { position:fixed; inset:0; background:rgba(20,16,40,.45); z-index:40; display:none; align-items:flex-end; justify-content:center; }
  .overlay.show { display:flex; }
  .sheet { background:#fff; border-radius:22px 22px 0 0; width:100%; max-width:560px; padding:18px 20px 34px; max-height:80vh; overflow-y:auto; animation:slideUp .22s ease; }
  @keyframes slideUp { from { transform: translateY(40px); opacity:0; } to { transform: translateY(0); opacity:1; } }
  .sheet h3 { font-size:17px; font-weight:800; margin-bottom:4px; }
  .sheet .close { float:right; border:none; background:#f0f1f8; width:30px; height:30px; border-radius:9px; font-size:15px; color:#666; cursor:pointer; }
  .sheet .sub { font-size:12.5px; color:#9a9fb8; margin-bottom:14px; }

  .toast { position:fixed; left:50%; bottom:80px; transform:translateX(-50%); background:rgba(35,41,74,.92); color:#fff;
    padding:11px 20px; border-radius:30px; font-size:14px; font-weight:700; z-index:60; opacity:0; pointer-events:none; transition:opacity .25s; max-width:80%; text-align:center; }
  .toast.show { opacity:1; }
  .bar { height:8px; background:#eceff8; border-radius:6px; overflow:hidden; margin-top:8px; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#5f3dc4,#8a5cf6); border-radius:6px; transition:width .3s; }
</style>
</head>
<body>

<div class="header">
  <h1>🚀 小升初英语 · 基础闯关</h1>
  <p>从零开始：先学单词 → 再懂句型 → 跟着读 → 小练习 → 原题实战<br>每题都有「为什么」，错了不白错</p>
  <div class="hdr-btns">
    <button class="btn white" id="homeBtn">🏠 课程地图</button>
    <button class="btn ghost" id="teacherBtn">👩‍🏫 老师面板</button>
    <button class="btn ghost" id="wrongBtn">📕 错题本 <span id="wrongCount"></span></button>
  </div>
</div>

<div class="wrap" id="app"></div>

<div class="overlay" id="teacherOv"><div class="sheet"><div id="teacherBody"></div></div></div>
<div class="overlay" id="wrongOv"><div class="sheet"><div id="wrongBody"></div></div></div>
<div class="overlay" id="tipsOv"><div class="sheet"><div id="tipsBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============ 工具 ============ */
function $(s){ return document.querySelector(s); }
function el(tag, cls, html){ const n=document.createElement(tag); if(cls) n.className=cls; if(html!=null) n.innerHTML=html; return n; }
let toastTimer;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1800);
}
let voiceEn=null, voiceZh=null;
const FEMALE_RE=/Samantha|Karen|Moira|Fiona|Victoria|Susan|Tessa|Rishi|Kate|Veena|Zira|Allison|Aria|Ava|Emma|Libby|Jenny|Sonia|Hazel|Georgia|Nathalie|Olivia|Nicky|Catherine|Daria|Zo[eë]|Zuzana|Yuna|Claire|Elena|Marta|Serena|Paulina|Hannah|Google US English|Google UK English|Ting-?Ting|Li-?mu|Sin-?ji|Mei-?Jia|Lili|Xiaoxiao|Xiaoyi|Huihui|Yaoyao|普通话|female/i;
function isFemale(v){ return FEMALE_RE.test(v.name||"") && !/male/i.test(v.name||""); }
function pickFemale(list){
  return list.find(v=>isFemale(v)&&/US|America/i.test(v.name)) || list.find(isFemale) || null;
}
function loadVoices(){
  const vs=window.speechSynthesis?speechSynthesis.getVoices():[];
  const en=vs.filter(v=>v.lang&&v.lang.toLowerCase().startsWith("en"));
  const zh=vs.filter(v=>v.lang&&(v.lang.toLowerCase().startsWith("zh")||v.lang.toLowerCase().startsWith("cmn")));
  voiceEn=pickFemale(en)||en.find(v=>/US|America/i.test(v.name))||en[0]||vs[0];
  voiceZh=pickFemale(zh)||zh[0]||null;
}
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function speak(text){
  if(!window.speechSynthesis){ toast("当前浏览器不支持朗读"); return; }
  const u=new SpeechSynthesisUtterance(text);
  u.rate=0.82; u.voice=/[一-鿿]/.test(text)?(voiceZh||voiceEn):voiceEn;
  speechSynthesis.speak(u); return u;
}
function stopSpeak(){ if(window.speechSynthesis) speechSynthesis.cancel(); }
function norm(s){ return (s||"").toLowerCase().replace(/\s+/g," ").trim(); }
function matchAns(got, want){
  const g=norm(got), W=Array.isArray(want)?want:[want];
  return W.some(w=>g===norm(w));
}

/* ============ 存储 ============ */
const LS_PROG="course_progress", LS_WRONG="course_wrong";
let progress={ lessons:{}, stars:0 };
let wrongStore=[];
function load(){ try{ progress=JSON.parse(localStorage.getItem(LS_PROG))||{lessons:{},stars:0}; wrongStore=JSON.parse(localStorage.getItem(LS_WRONG))||[]; selfStudy=localStorage.getItem("self_study")==="1"; }catch(e){} }
function saveProg(){ try{ localStorage.setItem(LS_PROG,JSON.stringify(progress)); }catch(e){} }
function saveWrong(){ try{ localStorage.setItem(LS_WRONG,JSON.stringify(wrongStore)); }catch(e){} updateWrongBadge(); }
function updateWrongBadge(){ const n=$("#wrongCount"); if(n) n.textContent=wrongStore.length?(" "+wrongStore.length+" "):""; }
function wrongOf(qid){ return wrongStore.find(w=>w.qid===qid); }

/* ============ 课时数据 ============ */
/* 每个课时：vocab 关一 / pattern 关二 / lines 关三 / quiz 关四 / final 关五 */
const LESSONS=[
{
  id:"l1", icon:"🙋", title:"人称代词", src:"讲义第 1037 页",
  teacher:{
    goal:"学生能分清主格和宾格，知道 me/him/her/us/them 用在动词或介词后面。",
    traps:["动词后面用宾格：with her、to me、like him","句子开头做主语用主格：We are friends.","别把 hers/me 和 my/our 混在一起——那是下一课。"],
    say:"先让她背两行表，再玩「我说主格你说宾格」的游戏，最后做句子。"
  },
  vocab:[
    {w:"friend",ipa:"/frend/",m:"n. 朋友",ex:"We are good friends.",exz:"我们是好朋友。",tip:"fri+end：真正的朋友陪你到最后（end）。"},
    {w:"teacher",ipa:"/ˈtiːtʃə/",m:"n. 老师",ex:"I am a teacher.",exz:"我是老师。",tip:"teach（教）+ er（人）= 教的人。"},
    {w:"student",ipa:"/ˈstjuːdnt/",m:"n. 学生",ex:"You are students.",exz:"你们是学生。",tip:"study（学习）的学生，study→student 注意变 y 加 ent。"},
    {w:"play",ipa:"/pleɪ/",m:"v. 玩；弹（乐器）",ex:"I like playing with her.",exz:"我喜欢和她一起玩。",tip:"play with=和…玩；play the violin=拉小提琴。"},
    {w:"sport",ipa:"/spɔːt/",m:"n. 运动",ex:"My favourite sport is basketball.",exz:"我最喜欢的运动是篮球。",tip:"favourite sport=最爱的运动。"},
    {w:"basketball",ipa:"/ˈbɑːskɪtbɔːl/",m:"n. 篮球",ex:"I play basketball after school.",exz:"我放学后打篮球。",tip:"basket（篮子）+ ball（球）。"},
    {w:"give",ipa:"/ɡɪv/",m:"v. 给",ex:"Give it to me, please.",exz:"请把它给我。",tip:"give sth to sb = 把某物给某人。"},
    {w:"sister",ipa:"/ˈsɪstə/",m:"n. 姐姐/妹妹",ex:"My sister often goes to school with him.",exz:"我妹妹经常和他一起去上学。",tip:"often 是副词：经常，放动词前。"}
  ],
  pattern:{
    title:"人称代词 · 主格和宾格",
    sub:"谁来做主语？谁跟在动词后面？",
    rows:[["主格","I","you","he","she","it","we","they"],["宾格","me","you","him","her","it","us","them"]],
    formula:"主格做主语，站在句首；宾格跟在动词或介词的后面。",
    note:"口诀：主格领头站句首，宾格跟在动词后。with her、to me、like him —— 介词和动词后面，全用宾格。",
    sents:["We are good friends. 我们是好朋友。","I like playing with her. 我喜欢和她一起玩。","My favourite sport is basketball. Hers is ping-pong. 我最喜欢的运动是篮球，她的是乒乓球。","Give it to me, please. 请把它给我。","My sister often goes to school with him. 我妹妹经常和他一起去上学。"]
  },
  lines:[
    {en:"We are good friends.",zh:"我们是好朋友。"},
    {en:"I like playing with her.",zh:"我喜欢和她一起玩。"},
    {en:"My favourite sport is basketball. Hers is ping-pong.",zh:"我最喜欢的运动是篮球，她的是乒乓球。"},
    {en:"Give it to me, please.",zh:"请把它给我。"},
    {en:"My sister often goes to school with him.",zh:"我妹妹经常和他一起去上学。"}
  ],
  quiz:[
    {t:"c", q:"句子开头做主语，填主格：___（我）am a student.", o:["I","me","my","mine"], a:"I", hint:"主语在句首，想一想表格第一行。", ex:"I 是主格，做主语放在句首；me 是宾格，不能站句首。"},

    {t:"c", q:"I will teach them how to find the answers ___ telling them the answers. 而不是。", o:["instead of","because of","full of","ready to"], a:"instead of", hint:"instead of=而不是，后面接动词-ing。", ex:"instead of telling them… 而不是告诉他们…。instead of 本课生词。"}
  ],
  final:[
    {t:"c", q:"1. He was surprised when he saw his ___ on his first day of school.", o:["A. hall","B. playground","C. library","D. classroom"], a:"D. classroom", hint:"开头 Tony 在中学，第一天看到自己的…？", ex:"D。Tony 是学生，在教室里上课，看到的是自己的教室 classroom。原题 1。"},
    {t:"c", q:"2. This term, they will ___ the electronic equipment to take notes.", o:["A. carry","B. use","C. take","D. buy"], a:"B. use", hint:"用电子设备来记笔记。", ex:"B。use…to take notes 用…来记笔记。carry 携带、buy 买都不顺。原题 2。"},
    {t:"c", q:"3. “It's very ___,” said Tony. \"I like using a tablet computer.\"", o:["A. difficult","B. important","C. interesting","D. comfortable"], a:"C. interesting", hint:"后面说“我喜欢”，说明他觉得…？", ex:"C。I like using… 说明他觉得很有趣 interesting。原题 3。"},
    {t:"c", q:"4. I like using a tablet computer to work on maths or other tasks ___ my team members.", o:["A. on","B. by","C. at","D. with"], a:"D. with", hint:"和我的队友们一起。", ex:"D。with my team members 和我的队友一起。with=和…一起。原题 4。"},
    {t:"c", q:"5. The school uses new technology in classrooms to help ___ see and hear.", o:["A. teachers","B. students","C. parents","D. workers"], a:"B. students", hint:"教室里谁在看和听？", ex:"B。教室里看和听的是学生 students。原题 5。"},
    {t:"c", q:"6. We are trying to use technology to ___ to kids. It can bring the outside world in.", o:["A. open up","B. look up","C. pick up","D. call up"], a:"A. open up", hint:"向孩子们「打开」外面的世界。", ex:"A。open up 打开：把外面的世界带进来 = 打开眼界。look up 查找。原题 6。"},
    {t:"c", q:"7. It is a quick way for students to ___ the outside world.", o:["A. help","B. plan","C. know","D. play"], a:"C. know", hint:"了解外面的世界。", ex:"C。know the outside world 了解外面的世界。原题 7。"},
    {t:"c", q:"8. I will try to teach them ___ to find the answers.", o:["A. why","B. what","C. when","D. how"], a:"D. how", hint:"教他们「怎么」找到答案。", ex:"D。teach them how to find the answers 教他们怎么找到答案。how=怎么。原题 8。"},
    {t:"c", q:"9. He was not really interested in his classes before, ___ now he likes them very much.", o:["A. but","B. and","C. or","D. so"], a:"A. but", hint:"以前不喜欢，现在喜欢 → 转折。", ex:"A。but 但是，表转折：以前不感兴趣，但现在很喜欢。原题 9。"},
    {t:"c", q:"10. He was not really interested in his classes before, but now he ___ them very much.", o:["A. stand","B. hate","C. enjoy","D. clean"], a:"C. enjoy", hint:"现在很喜欢 = 享受。", ex:"C。enjoy them very much 非常喜欢/享受。hate 讨厌意思相反。原题 10。"}
  ]
}
];

/* ============ 状态 ============ */
let cur = { lesson:null, stage:0, i:0, score:0, total:0 };  // i 是当前小步索引
let selfStudy = false;   // 自学模式：不闯关，自由翻看知识点
let lastEx = "";         // 上一条题解，供「🔊 读讲解」
const STAGE_NAMES = ["关一 单词","关二 句型","关三 跟读","关四 练习","关五 实战"];
const app = $("#app");

/* ============ 渲染：课程地图 ============ */
function renderHome(){
  stopSpeak();
  const done = Object.values(progress.lessons).filter(l=>l.done).length;
  const stars = Object.values(progress.lessons).reduce((s,l)=>s+(l.stars||0),0);
  const h = el("div");
  h.appendChild(el("div","stat-row",`
    <div class="stat"><b>${done}/${LESSONS.length}</b><span>已学课时</span></div>
    <div class="stat"><b>${stars}/${LESSONS.length*3}</b><span>累计星星</span></div>
    <div class="stat"><b>${wrongStore.length}</b><span>待练错题</span></div>`));
  h.appendChild(el("div","card",`
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div>
        <b style="font-size:15px">📖 自学模式</b>
        <div style="font-size:12.5px;color:#9a9fb8;margin-top:3px;line-height:1.6">不闯关，直接翻看所有课的知识点，点 🔊 就能读出来</div>
      </div>
      <button class="btn ${selfStudy?"pink":"green"}" style="flex-shrink:0" onclick="toggleSelfStudy()">${selfStudy?"已开启 ✓":"去开启"}</button>
    </div>`));
  LESSONS.forEach(L=>{
    const st = progress.lessons[L.id];
    const doneIt = st && st.done;
    const go = selfStudy ? "📖 自由翻 →" : (doneIt?"🔁 复习":"开始 →");
    const card = el("div","l-card"+(doneIt?" done":""),`
      <div class="icon">${L.icon}</div>
      <div class="info">
        <div class="t">${L.title}</div>
        <div class="s">${L.src} · ${doneIt?"已完成":(st?"进行中":"未开始")}</div>
        <div class="stars">${doneIt ? "★".repeat(st.stars||0)+"☆".repeat(3-(st.stars||0)) : ""}</div>
      </div>
      <div class="go">${go}</div>`);
    card.onclick = ()=> openLesson(L.id);
    h.appendChild(card);
  });
  h.appendChild(el("div","card",`
    <b style="font-size:15px">📌 怎么用</b>
    <p style="font-size:13.5px;color:#5a5f7a;line-height:1.8;margin-top:8px">
    每一课都走同一条路：<b>先学这课的生词 → 看句型公式 → 一句一句跟着读 → 做小练习 → 最后上原卷实战</b>。
    每道题做完都会告诉你「为什么」，答错了也别怕，看讲解就能懂。<br>
    <span style="color:#9a9fb8">建议一次学一课（约 10 分钟），学完第二天先复习错题再开新课。<br>想快速翻知识点、不闯关，就打开上方「📖 自学模式」。</span></p>`));
  app.innerHTML=""; app.appendChild(h);
}

/* ============ 渲染：课时流程 ============ */
function openLesson(id){
  const L = LESSONS.find(x=>x.id===id);
  if(selfStudy){ cur={ lesson:L, stage:0, i:0, ssTab:0 }; renderSelfStudy(); return; }
  cur = { lesson:L, stage:1, i:0, score:0, fscore:0, total:0 };
  renderStage();
}
function backToLesson(){
  cur.i = 0; cur.stage = 1; cur.fscore = 0; renderStage();
}

function stageBar(){
  return `<div class="steps">${STAGE_NAMES.map((s,ix)=>{
    const cls = ix+1<cur.stage?"done":(ix+1===cur.stage?"on":"");
    return `<div class="step ${cls}">${s}</div>`;
  }).join("")}</div>`;
}
function lessonTop(){
  const L = cur.lesson;
  const title = L?`${L.icon} ${L.title}`:"📕 错题重练";
  const src = L?L.src:"";
  const tipsBtn = (L && cur.stage!==0)?`<button class="btn ghost" style="background:#f1ecff;color:#5f3dc4" onclick="showTips()">👩‍🏫 要点</button>`:"";
  return `<div class="lesson-top">
    <button class="back" onclick="renderHome()">←</button>
    <div class="ti"><b>${title}</b><span>${src}</span></div>
    ${tipsBtn}
  </div>`;
}

function renderStage(){
  stopSpeak();
  const L = cur.lesson;
  let body="";
  if(cur.stage===1){ body = stageVocab(); }
  else if(cur.stage===2){ body = stagePattern(); }
  else if(cur.stage===3){ body = stageLines(); }
  else if(cur.stage===4){ body = stageQuiz(false); }
  else if(cur.stage===5){ body = stageQuiz(true); }
  else { body = stageDone(); }
  if(body===null){ app.innerHTML = lessonTop() + stageDone(); return; }  // null = 全部关卡做完，进完成页
  app.innerHTML = lessonTop() + stageBar() + `<div class="stage-tag">${STAGE_NAMES[cur.stage-1]}</div>` + body;
}

/* ---- 关一 单词 ---- */
function stageVocab(){
  const L = cur.lesson;
  const w = L.vocab[cur.i];
  const total = L.vocab.length;
  if(!w){ cur.stage=2; cur.i=0; return stagePattern(); }
  cur.total = total;
  const bar = `<div class="bar"><i style="width:${Math.round(cur.i/total*100)}%"></i></div>`;
  return `<div class="card w-card">
    ${bar}
    <div class="w-prog">单词 ${cur.i+1} / ${total}　·　这一课先认识它们，才读得懂后面的句子</div>
    <div class="w-word" style="margin-top:8px">${w.w}</div>
    <div class="w-ipa">${w.ipa}</div>
    <button class="w-sound" onclick="speak('${w.w.replace(/'/g,"\\'")}')">🔊 听发音</button>
    <div class="w-meaning" id="wMean">
      <div class="m">${w.m}</div>
      <div class="ex">${w.ex}<br><span style="color:#9a9fb8">${w.exz}</span></div>
      <div class="tip">💡 ${w.tip} <button class="say" style="margin-left:6px" onclick="speak('${sq(w.tip)}')">🔊 读口诀</button></div>
    </div>
    <div class="w-btns">
      <button class="btn grey" onclick="revealMeaning()">👁️ 看意思</button>
      <button class="btn green" onclick="wordKnow(true)">✅ 认识</button>
      <button class="btn pink" onclick="wordKnow(false)">❌ 不认识</button>
    </div>
  </div>`;
}
function revealMeaning(){
  $("#wMean").classList.add("show");
  speak(cur.lesson.vocab[cur.i].w);
}
function wordKnow(known){
  const w = cur.lesson.vocab[cur.i];
  if(!known){
    const q = { t:"f", q:w.w+"（"+w.m+"）", a:w.w, hint:"", ex:"把这个词记进错题本，明早再拼一次。" };
    addWrong(cur.lesson.id, "word:"+w.w, q);
    toast("已记入错题本，明天再练");
  }
  cur.i++;
  renderStage();
}
function nextWord(){ wordKnow(true); }

/* ---- 关二 句型 ---- */
function stagePattern(){
  const p = cur.lesson.pattern;
  const rows = (p.rows||[]).map(r=>{
    const tds = r.map((c,ix)=> ix===0?`<td class="lbl">${c}</td>`:`<td>${c}</td>`).join("");
    return `<tr>${tds}</tr>`;
  }).join("");
  const sents = (p.sents||[]).map((s,ix)=>{
    return `<div class="one"><span><b>${enPart(s)}</b> <small style="color:#9a9fb8">${zhPart(s)}</small></span><button class="say" onclick="speakPat(${ix})">🔊</button></div>`;
  }).join("");
  return `<div class="card">
    <div class="f-title">${p.title}</div>
    <div class="f-sub">${p.sub||""}</div>
    ${p.rows?`<table class="tbl"><tr>${p.rows[0].map((c,ix)=>ix===0?"<th>种类</th>":"<th>"+c+"</th>").join("")}</tr>${rows}</table>`:""}
    <div class="formula">📐 ${p.formula} <button class="say" style="background:rgba(255,255,255,.22);color:#fff" onclick="speakFormula()">🔊</button></div>
    <div class="note">💬 ${p.note} <button class="say" style="background:#fff4d6;color:#b07d00" onclick="speakNote()">🔊</button></div>
    ${sents?`<div class="f-sent"><div class="lbl">例句（点 🔊 跟读）</div>${sents}</div>`:""}
    <div style="margin-top:18px;display:flex;gap:10px">
      <button class="btn ghost" style="background:#eef0f8;color:#5a5f7a" onclick="playAllSents()">🔊 全读一遍</button>
      <button class="btn primary" style="flex:1;background:#5f3dc4;color:#fff" onclick="cur.stage=3;cur.i=0;renderStage()">都懂了 → 去跟读</button>
    </div>
  </div>`;
}
function enPart(s){ const i=s.search(/[一-鿿]/); return i>=0?s.slice(0,i).trim():s; }
function zhPart(s){ const i=s.search(/[一-鿿]/); return i>=0?s.slice(i).trim():""; }
function speakPat(ix){ const s=(cur.lesson.pattern.sents||[])[ix]; if(s) speak(enPart(s)); }
function playAllSents(){
  stopSpeak();
  const sents=cur.lesson.pattern.sents||[];
  sents.forEach((s,i)=>{ setTimeout(()=>speak(enPart(s)), i*1700); });
}

/* ---- 关三 跟读 ---- */
function stageLines(){
  const L = cur.lesson;
  const line = L.lines[cur.i];
  if(!line){ cur.stage=4; cur.i=0; return stageQuiz(false); }
  cur.total = L.lines.length;
  const bar = `<div class="bar"><i style="width:${Math.round(cur.i/L.lines.length*100)}%"></i></div>`;
  return `<div class="card line-card">
    ${bar}
    <div class="w-prog">句子 ${cur.i+1} / ${L.lines.length}　·　先看中文，再说英文</div>
    <div class="line-zh" style="margin-top:10px">${line.zh}</div>
    <div class="line-en" id="lineEn">
      ${line.en}
      <div><button class="snd" onclick="speakLine()">🔊 听英文</button></div>
    </div>
    <div style="margin-top:24px;display:flex;gap:10px">
      <button class="btn white" style="flex:1;background:#5f3dc4;color:#fff" onclick="revealLine()">👉 看英文</button>
      <button class="btn green" onclick="cur.i++;renderStage()">下一句 →</button>
    </div>
  </div>`;
}
function revealLine(){
  const e=$("#lineEn"); e.classList.add("show");
  speak(cur.lesson.lines[cur.i].en);
}
function speakLine(){ speak(cur.lesson.lines[cur.i].en); }

/* ---- 关四/关五 题目 ---- */
function stageQuiz(isFinal){
  const L = cur.lesson;
  const list = isFinal?L.final:L.quiz;
  if(!list || !list.length){ if(isFinal){ return null; } else { cur.stage=5; return stageQuiz(true); } }
  if(cur.i>=list.length){ cur.i=0; if(isFinal){ return null; } else { cur.stage=5; cur.fscore=0; return stageQuiz(true); } }
  cur.total = list.length;
  const q = list[cur.i];
  const bar = `<div class="bar"><i style="width:${Math.round(cur.i/list.length*100)}%"></i></div>`;
  let inner = "";
  if(q.t==="f"){
    inner = `<div class="q-text">${q.q}</div>
      <div class="fill-row"><input class="fill-in" id="fillIn" placeholder="在这里输入…" autocomplete="off" autocapitalize="off">
      <button class="btn primary" style="background:#5f3dc4;color:#fff;flex-shrink:0" onclick="submitFill()">提交</button></div>`;
  } else {
    inner = `<div class="q-text">${q.q}</div>
      <div class="opts">${q.o.map((o,ix)=>`<button class="opt" data-i="${ix}" onclick="pickOpt(this,${ix})">${o}</button>`).join("")}</div>`;
  }
  return `<div class="card q-card">
    ${bar}
    <div class="q-num">${isFinal?"🖊 原题实战":"✏️ 小练习"}　第 ${cur.i+1} / ${list.length} 题${isFinal?"　·　选对了算分拿星星":""}</div>
    ${inner}
    ${q.hint?`<button class="q-hint" onclick="showQHint()">💡 提示</button><div class="q-hint-box" id="hintBox">${q.hint}</div>`:""}
    <div class="q-feedback" id="qFb"></div>
  </div>`;
}
function showQHint(){ const h=$("#hintBox"); if(h){ h.classList.add("show"); } }
function renderFb(ok, q){
  lastEx=q.ex;
  const fb=$("#qFb");
  fb.className="q-feedback show "+(ok?"ok":"bad");
  fb.innerHTML = `<div class="v">${ok?"✅ 答对了！":"❌ 答错了"}</div>
    <div class="why">${ok?q.ex:"正确答案："+(Array.isArray(q.a)?q.a.join(" / "):q.a)+"<br><br>💡 "+q.ex}</div>`;
  const snd = el("button","btn grey","🔊 读讲解");
  snd.onclick=speakFb; snd.style.cssText="width:100%;margin-top:10px";
  fb.appendChild(snd);
  const nxt = el("div","",`<button class="btn primary" style="width:100%;margin-top:12px;background:#5f3dc4;color:#fff" onclick="cur.i++;renderStage()">下一题 →</button>`);
  fb.appendChild(nxt);
  fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function pickOpt(btn, ix){
  const L = cur.lesson;
  const q = (cur.stage===5?L.final:L.quiz)[cur.i];
  const ok = matchAns(q.o[ix], q.a);
  const qid = cur.lesson.id+":"+(cur.stage===5?"f":"q")+cur.i;
  document.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; if(+b.dataset.i===ix) b.classList.add(ok?"sel-right":"sel-wrong"); else b.classList.add("dim"); });
  if(ok){ if(cur.stage===5) cur.fscore++; } else { addWrong(cur.lesson.id, qid, q); }
  renderFb(ok, q);
}
function submitFill(){
  const L = cur.lesson;
  const q = (cur.stage===5?L.final:L.quiz)[cur.i];
  const got = ($("#fillIn")||{}).value||"";
  const ok = matchAns(got, q.a);
  const qid = cur.lesson.id+":"+(cur.stage===5?"f":"q")+cur.i;
  $("#fillIn").disabled=true;
  if(ok){ if(cur.stage===5) cur.fscore++; } else { addWrong(cur.lesson.id, qid, q); }
  renderFb(ok, q);
}

/* ---- 完成页 ---- */
function stageDone(){
  const L = cur.lesson;
  const final = L.final;
  const n = final.length;
  const rate = n? Math.min(1, cur.fscore/n) : 1;
  const stars = rate>=0.99?3:(rate>=0.6?2:1);
  progress.lessons[L.id] = { done:true, stars:Math.max(stars, progress.lessons[L.id]?.stars||0) };
  saveProg();
  return `<div class="card done-card">
    <div class="done-big">${stars>=3?"🏆":(stars===2?"🎉":"💪")}</div>
    <div class="done-title">${L.title} 学完啦！</div>
    <div class="done-stars">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div>
    <div class="done-sub">关五实战对了 ${cur.fscore} / ${n} 题<br>错题已收进错题本，明天复习</div>
    <div style="margin-top:20px;display:flex;gap:10px">
      <button class="btn ghost" style="background:#eef0f8;color:#5a5f7a" onclick="backToLesson()">🔁 再学一遍</button>
      <button class="btn primary" style="flex:1;background:#5f3dc4;color:#fff" onclick="renderHome()">返回地图</button>
    </div>
  </div>`;
}
function finishLesson(){ renderStage(); }

/* ============ 错题 ============ */
function addWrong(lessonId, qid, q){
  const w = wrongStore.find(x=>x.qid===qid);
  if(w){ w.streak=0; } else { wrongStore.push({ lessonId, qid, q, streak:0, correct:0 }); }
  saveWrong();
}
function openWrong(){
  const b=$("#wrongBody");
  if(!wrongStore.length){ b.innerHTML=`<h3>📕 错题本</h3><div class="empty">目前没有错题，继续加油！</div>`; $("#wrongOv").classList.add("show"); return; }
  b.innerHTML=`<button class="close" onclick="closeOv('wrongOv')">✕</button>
    <h3>📕 错题本</h3><div class="sub">共 ${wrongStore.length} 题 · 连对 2 次自动移出</div>
    <button class="btn primary" style="width:100%;margin-bottom:14px;background:#ff5c8a;color:#fff" onclick="startWrongPractice()">🔁 重练全部错题</button>
    ${wrongStore.map((w,i)=>`
      <div class="wr-item">
        <div class="lbl">${lessonTitle(w.lessonId)} · ${w.q.t==="f"?"拼写/填空":"选择"}</div>
        <div class="q">${w.q.q}</div>
        <div class="a">✔ ${Array.isArray(w.q.a)?w.q.a.join(" / "):w.q.a}</div>
        <div class="why">${w.q.ex||""}</div>
      </div>`).join("")}
    <button class="btn grey" style="width:100%;margin-top:6px" onclick="clearWrong()">🗑 清空错题</button>`;
  $("#wrongOv").classList.add("show");
}
function lessonTitle(id){ const L=LESSONS.find(x=>x.id===id); return L?L.title:id; }
function clearWrong(){ wrongStore=[]; saveWrong(); openWrong(); }
let wp = { list:[], i:0 };
function startWrongPractice(){
  wp = { list:wrongStore.slice(), i:0 };
  $("#wrongOv").classList.remove("show");
  renderWrongPractice();
}
function renderWrongPractice(){
  const appBody = app;
  if(!wp.list.length){ toast("错题都练完了 🎉"); wrongStore=[]; saveWrong(); renderHome(); return; }
  if(wp.i>=wp.list.length){ toast("本轮完成"); renderHome(); return; }
  const item = wp.list[wp.i];
  const q = item.q;
  const bar = `<div class="bar"><i style="width:${Math.round(wp.i/wp.list.length*100)}%"></i></div>`;
  let inner = "";
  if(q.t==="f"){
    inner = `<div class="q-text">${q.q}</div>
      <div class="fill-row"><input class="fill-in" id="wpFill" placeholder="输入答案…" autocomplete="off" autocapitalize="off">
      <button class="btn primary" style="background:#5f3dc4;color:#fff;flex-shrink:0" onclick="wpSubmit()">提交</button></div>`;
  } else {
    inner = `<div class="q-text">${q.q}</div>
      <div class="opts">${q.o.map((o,ix)=>`<button class="opt" data-i="${ix}" onclick="wpPick(this,${ix})">${o}</button>`).join("")}</div>`;
  }
  appBody.innerHTML = `${lessonTop()}${bar}
    <div class="stage-tag">🔁 错题重练</div>
    <div class="card q-card">
      <div class="q-num">第 ${wp.i+1} / ${wp.list.length} 道错题</div>
      ${inner}
      <div class="q-feedback" id="wpFb"></div>
    </div>`;
}
function wpPick(btn, ix){
  const q = wp.list[wp.i].q;
  const ok = matchAns(q.o[ix], q.a);
  document.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; if(+b.dataset.i===ix) b.classList.add(ok?"sel-right":"sel-wrong"); else b.classList.add("dim"); });
  wpDone(ok, q);
}
function wpSubmit(){
  const q = wp.list[wp.i].q;
  const ok = matchAns(($("#wpFill")||{}).value||"", q.a);
  $("#wpFill").disabled=true;
  wpDone(ok, q);
}
function wpDone(ok, q){
  lastEx=q.ex;
  const w = wp.list[wp.i];
  const fb=$("#wpFb");
  fb.className="q-feedback show "+(ok?"ok":"bad");
  fb.innerHTML=`<div class="v">${ok?"✅ 对！":"❌ 再记一遍"}</div>
    <div class="why">${ok?q.ex:"正确答案："+(Array.isArray(q.a)?q.a.join(" / "):q.a)+"　"+q.ex}</div>`;
  const snd=el("button","btn grey","🔊 读讲解");
  snd.onclick=speakFb; snd.style.cssText="width:100%;margin-top:10px";
  fb.appendChild(snd);
  const nxt=el("div","",`<button class="btn primary" style="width:100%;margin-top:12px;background:#5f3dc4;color:#fff" onclick="wpNext(${ok})">下一题 →</button>`);
  fb.appendChild(nxt);
}
function wpNext(ok){
  const store = wrongStore.find(x=>x.qid===wp.list[wp.i].qid);
  if(ok){ if(store){ store.correct=(store.correct||0)+1; if(store.correct>=2){ wrongStore = wrongStore.filter(x=>x.qid!==store.qid); } } }
  else { if(store){ store.correct=0; store.streak=0; } }
  saveWrong();
  wp.i++; renderWrongPractice();
}

/* ============ 老师面板 / 要点 ============ */
function showTips(){
  const L = cur.lesson;
  $("#tipsBody").innerHTML=`<button class="close" onclick="closeOv('tipsOv')">✕</button>
    <h3>👩‍🏫 ${L.title} · 老师要点</h3><div class="sub">${L.src}　·　上课时看这里</div>
    <div class="t-block t-goal"><b>🎯 本节课目标</b><p>${L.teacher.goal}</p>
      <button class="say" style="margin-top:8px" onclick="speak('${sq(L.teacher.goal)}')">🔊 读出来</button></div>
    <div class="t-block t-trap"><b>⚠️ 学生常踩的坑</b><ul>${L.teacher.traps.map((t,i)=>`<li>${t} <button class="say" style="vertical-align:middle" onclick="speakTrap(${i})">🔊</button></li>`).join("")}</ul></div>
    <div class="t-block t-say"><b>🗣️ 带教话术</b><p>${L.teacher.say}</p>
      <button class="say" style="margin-top:8px" onclick="speak('${sq(L.teacher.say)}')">🔊 读出来</button></div>`;
  $("#tipsOv").classList.add("show");
}
function openTeacher(){
  const done = Object.values(progress.lessons).filter(l=>l.done).length;
  const stars = Object.values(progress.lessons).reduce((s,l)=>s+(l.stars||0),0);
  $("#teacherBody").innerHTML=`<button class="close" onclick="closeOv('teacherOv')">✕</button>
    <h3>👩‍🏫 老师面板</h3><div class="sub">已学 ${done}/${LESSONS.length} 课 · 星星 ${stars}/${LESSONS.length*3} · 错题 ${wrongStore.length} 道</div>
    ${LESSONS.map(L=>{
      const st=progress.lessons[L.id];
      return `<div class="wr-item">
        <div class="lbl">${L.icon} ${L.title}　${L.src}</div>
        <div class="q" style="font-weight:700">${st&&st.done?("已完成 · "+"★".repeat(st.stars)):"未开始"}</div>
        <div class="why">${L.teacher.goal}</div>
      </div>`;
    }).join("")}
    <div class="t-block t-goal" style="margin-top:6px"><b>📱 平台提示</b>
      <p>发音朗读（TTS）iPhone Safari 可用；语音识别打分仅安卓/Chrome 支持。本系统只用了朗读，iPhone 全功能可用。</p></div>
    <button class="btn grey" style="width:100%;margin-top:8px" onclick="closeOv('teacherOv')">关闭</button>`;
  $("#teacherOv").classList.add("show");
}
function closeOv(id){ $("#"+id).classList.remove("show"); }

/* ============ 自学模式 ============ */
function sq(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\n/g," "); }
function toggleSelfStudy(){
  selfStudy=!selfStudy;
  try{ localStorage.setItem("self_study", selfStudy?"1":"0"); }catch(e){}
  renderHome();
}
const SS_TABS=["📖 单词","📐 公式","🗣 跟读","👩‍🏫 要点"];
function renderSelfStudy(){
  stopSpeak();
  const tabs=SS_TABS.map((t,ix)=>`<div class="step ${ix===cur.ssTab?"on":""}" onclick="ssTab(${ix})">${t}</div>`).join("");
  let body="";
  if(cur.ssTab===0) body=ssVocab();
  else if(cur.ssTab===1) body=ssPattern();
  else if(cur.ssTab===2) body=ssLines();
  else body=ssTips();
  app.innerHTML = lessonTop() + `<div class="steps">${tabs}</div><div class="stage-tag">📖 自学模式 · 自由翻看，随便点 🔊 听</div>` + body;
}
function ssTab(ix){ cur.ssTab=ix; cur.i=0; renderSelfStudy(); }
function ssPrev(){ cur.i--; renderSelfStudy(); }
function ssNext(){ cur.i++; renderSelfStudy(); }
function ssVocab(){
  const L=cur.lesson, list=L.vocab;
  if(cur.i>=list.length) cur.i=0;
  if(cur.i<0) cur.i=list.length-1;
  const w=list[cur.i];
  const nav=`<div style="display:flex;gap:10px;margin-top:22px">
      <button class="btn ghost" style="flex:1;background:#eef0f8;color:#5a5f7a" onclick="ssPrev()">◀️ 上一个</button>
      <button class="btn primary" style="flex:1;background:#5f3dc4;color:#fff" onclick="ssNext()">下一个 ▶️</button></div>`;
  return `<div class="card w-card">
    <div class="w-prog">单词 ${cur.i+1} / ${list.length}　·　自学模式：意思直接显示</div>
    <div class="w-word" style="margin-top:8px">${w.w}</div>
    <div class="w-ipa">${w.ipa}</div>
    <button class="w-sound" onclick="speak('${sq(w.w)}')">🔊 听发音</button>
    <div class="w-meaning show">
      <div class="m">${w.m}</div>
      <div class="ex">${w.ex}<br><span style="color:#9a9fb8">${w.exz}</span>
        <div style="margin-top:8px"><button class="say" onclick="speak('${sq(w.ex)}')">🔊 读例句</button></div></div>
      <div class="tip">💡 ${w.tip} <button class="say" style="margin-left:6px" onclick="speak('${sq(w.tip)}')">🔊 读口诀</button></div>
    </div>
    ${nav}
  </div>`;
}
function ssPattern(){
  const p=cur.lesson.pattern;
  const rows=(p.rows||[]).map(r=>{
    const tds=r.map((c,ix)=> ix===0?`<td class="lbl">${c}</td>`:`<td>${c}</td>`).join("");
    return `<tr>${tds}</tr>`;
  }).join("");
  const sents=(p.sents||[]).map((s,ix)=>{
    return `<div class="one"><span><b>${enPart(s)}</b> <small style="color:#9a9fb8">${zhPart(s)}</small></span><button class="say" onclick="speakPat(${ix})">🔊</button></div>`;
  }).join("");
  return `<div class="card">
    <div class="f-title">${p.title}</div>
    <div class="f-sub">${p.sub||""}</div>
    ${p.rows?`<table class="tbl"><tr>${p.rows[0].map((c,ix)=>ix===0?"<th>种类</th>":"<th>"+c+"</th>").join("")}</tr>${rows}</table>`:""}
    <div class="formula">📐 ${p.formula} <button class="say" style="background:rgba(255,255,255,.22);color:#fff" onclick="speakFormula()">🔊</button></div>
    <div class="note">💬 ${p.note} <button class="say" style="background:#fff4d6;color:#b07d00" onclick="speakNote()">🔊</button></div>
    ${sents?`<div class="f-sent"><div class="lbl">例句（点 🔊 跟读）</div>${sents}</div>`:""}
    <div style="margin-top:18px;display:flex;gap:10px">
      <button class="btn ghost" style="background:#eef0f8;color:#5a5f7a" onclick="playAllSents()">🔊 全读一遍</button>
      <button class="btn primary" style="flex:1;background:#5f3dc4;color:#fff" onclick="ssTab(2)">去跟读 →</button>
    </div>
  </div>`;
}
function ssLines(){
  const L=cur.lesson, list=L.lines;
  if(cur.i>=list.length) cur.i=0;
  if(cur.i<0) cur.i=list.length-1;
  const line=list[cur.i];
  return `<div class="card line-card">
    <div class="w-prog">句子 ${cur.i+1} / ${list.length}　·　先听中文意思，再听英文</div>
    <div class="line-zh" style="margin-top:10px">${line.zh}</div>
    <div class="line-en show" style="margin-top:16px">${line.en}
      <div style="margin-top:12px"><button class="snd" onclick="speakLine()">🔊 听英文</button></div>
    </div>
    <div style="margin-top:24px;display:flex;gap:10px">
      <button class="btn ghost" style="flex:1;background:#eef0f8;color:#5a5f7a" onclick="ssPrev()">◀️ 上一个</button>
      <button class="btn primary" style="flex:1;background:#5f3dc4;color:#fff" onclick="ssNext()">下一个 ▶️</button>
    </div>
  </div>`;
}
function ssTips(){
  const L=cur.lesson;
  return `<div class="card">
    <div class="t-block t-goal"><b>🎯 本节课目标</b><p>${L.teacher.goal}</p>
      <button class="say" style="margin-top:8px" onclick="speak('${sq(L.teacher.goal)}')">🔊 读出来</button></div>
    <div class="t-block t-trap"><b>⚠️ 学生常踩的坑</b><ul>${L.teacher.traps.map((t,i)=>`<li>${t} <button class="say" style="vertical-align:middle" onclick="speakTrap(${i})">🔊</button></li>`).join("")}</ul></div>
    <div class="t-block t-say"><b>🗣️ 带教话术</b><p>${L.teacher.say}</p>
      <button class="say" style="margin-top:8px" onclick="speak('${sq(L.teacher.say)}')">🔊 读出来</button></div>
  </div>`;
}
function speakFormula(){ speak(cur.lesson.pattern.formula); }
function speakNote(){ speak(cur.lesson.pattern.note); }
function speakTrap(ix){ speak(cur.lesson.teacher.traps[ix]); }
function speakFb(){ if(lastEx) speak(lastEx); }

/* ============ 事件绑定 + 启动 ============ */
$("#homeBtn").onclick=renderHome;
$("#teacherBtn").onclick=openTeacher;
$("#wrongBtn").onclick=openWrong;
load(); updateWrongBadge(); renderHome();
</script>
</body>
